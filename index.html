<body>
  <div class="top-hero">
    <div id="console"><span class="destaque">Welcome to Fear City — Ur-Shulgi Online</span>
</div>
  </div>
  <div class="painel">
    <h2>PAINEL DE ROLAGEM</h2>
    <div class="secao">
      <div class="grid-2" style="align-items:center;">
        <span style="font-size:12px;">👤 Personagem:</span>
        <input id="jogador" value="Narrador" style="color:#00FFFF;">
      </div>
      <div class="grid-2" style="margin-top:4px;">
        <button onclick="caraCoroa()">Cara ou Coroa</button>
        <button onclick="rouseCheck()">Teste do Despertar</button>
      </div>
    </div>

    <div class="secao">
      <span class="titulo-sec">Rolagem de Dados (Híbrido V20/V5):</span>
      <div class="grid-4">
        <div><input id="qtd" type="number" value="5"><span class="lbl-mini">Pool</span></div>
        <div><select id="faces"><option value="10">d10</option><option value="6">d6</option><option value="4">d4</option></select><span class="lbl-mini">Tipo</span></div>
        <div><input id="diff" type="number" value="6"><span class="lbl-mini">Dif</span></div>
        <div><input id="loucura" type="number" value="0" style="color:#FFD700;background:#2A0000;"><span class="lbl-mini" style="color:#FF6666;">Loucura</span></div>
      </div>
      <button onclick="rolarCustom()">Rolar e Enviar (Discord)</button>
    </div>

    <div class="secao secao-loucura">
      <span class="titulo-sec">MOTOR DA BESTA (DADOS DA LOUCURA)</span>
      <div class="grid-3">
        <div><input id="sng" value="60%"><span class="lbl-mini">Sng%/Fome</span></div>
        <div><input id="fv" type="number" value="3" style="color:#00FFFF;"><span class="lbl-mini">FV Atual</span></div>
        <div><input id="hum" type="number" value="7"><span class="lbl-mini">Humanidade</span></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="c_disc"> +1 Disc</label>
        <label><input type="checkbox" id="c_agrav"> +2 Agrav</label>
        <label><input type="checkbox" id="c_fv"> -2 FV Cena</label>
      </div>
      <button class="btn-loucura" onclick="rolarLoucura()">Rolar Dados da Loucura</button>
    </div>

    <div class="secao">
      <span class="titulo-sec">Calculadora de Dano:</span>
      <div class="grid-3">
        <div><select id="tipo_dano"><option>Superficial</option><option>Agravado</option></select><span class="lbl-mini">Tipo</span></div>
        <div><input id="dano_bruto" type="number" value="0"><span class="lbl-mini">Bruto</span></div>
        <div><input id="fort" type="number" value="0"><span class="lbl-mini">Fortitude</span></div>
      </div>
      <button onclick="calcularDano()">Calcular e Enviar</button>
    </div>

    <div class="secao">
      <span class="titulo-sec">Comando (!roll, !loucura, !limpar):</span>
      <div class="grid-2" style="grid-template-columns: 3fr 1fr;">
        <input id="cmd" placeholder="!roll 5d10 6 2" onkeydown="if(event.key==='Enter')execCmd()">
        <button style="margin-top:0;" onclick="execCmd()">OK</button>
      </div>
    </div>
  </div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1568818499554512896/zMRDTAPfSXbLzYLBK2EIp4Cv9df3EvY_pXEr6I7UkqflAfzrhSHaLEHbYXn4kKe7zA_1";
const ESCALA = {
  0: ["Plenitude e Controle Total", "Sem penalidades"],
  1: ["Murmúrio Distante da Besta", "-0 dados"],
  2: ["Irritabilidade / Foco Predatório", "-1 dado em combate"],
  3: ["Instinto Suplantando a Razão", "-1 Social | -2 Disciplina"],
  4: ["Urgência de Sangue / Paranoia", "-3 em todos os testes"],
  5: ["Iminência de Frenesi / Vazio", "-5 combate | Rouse Check Frenesi"]
};
const COMPULSOES = {
  0: "Sem compulsão ativa.",
  1: "Foco Predatório (+1 Social vs mortais).",
  2: "Foco Predatório (+1 Social vs mortais).",
  3: "Instinto (-1 Social com mortais).",
  4: "Urgência (Alimentar-se na cena ou -3 dados na próxima).",
  5: "Vassalagem (-4 dados fora alimentação; Rouse Check Frenesi Dif 4)."
};

function log(txt, cls="normal") {
  const c = document.getElementById("console");
  const s = document.createElement("span");
  s.className = cls; s.textContent = txt;
  c.appendChild(s); c.scrollTop = c.scrollHeight;
}

function enviarDiscord(titulo, descricao, corHex) {
  const jogador = document.getElementById("jogador").value.trim() || "Anônimo";
  const corInt = parseInt(corHex.replace("#", ""), 16);
  fetch(WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: "Ur-Shulgi",
      avatar_url: "https://i.imgur.com/L1M4rA6.png",
      embeds: [{ title: "🩸 " + jogador + " | " + titulo, description: descricao, color: corInt }]
    })
  }).catch(()=>{});
}

function d(faces) { return Math.floor(Math.random() * faces) + 1; }

function caraCoroa() {
  const r = Math.random() < 0.5 ? "Cara" : "Coroa";
  log("\n> Alea Jacta Est: ", "normal"); log("[" + r + "]\n", "destaque");
  enviarDiscord("Alea Jacta Est", "Resultado da moeda: **" + r + "**", "#888888");
}

function rouseCheck() {
  const r = d(10);
  log("\n> Teste do Despertar (1d10): ", "normal");
  if (r >= 6) {
    log("[" + r + "] SUCESSO (Fome mantida)\n", "sucesso");
    enviarDiscord("Teste do Despertar", "Rolagem: **" + r + "**\nResultado: **SUCESSO** (Fome mantida).", "#00FF00");
  } else {
    log("[" + r + "] FALHA (+1 Fome)\n", "falha");
    enviarDiscord("Teste do Despertar", "Rolagem: **" + r + "**\nResultado: **FALHA** (+1 Fome). A Besta tem sede.", "#FF3333");
  }
}

function mapearFome() {
  const raw = document.getElementById("sng").value.trim();
  const val = parseInt(raw.replace("%", "")) || 0;
  let f = 0;
  if (raw.includes("%") || val > 5) {
    if (val >= 90) f = 0; else if (val >= 70) f = 1; else if (val >= 50) f = 2;
    else if (val >= 30) f = 3; else if (val >= 10) f = 4; else f = 5;
  } else { f = Math.max(0, Math.min(5, val)); }
  return f;
}

function rolarLoucura() {
  const f = mapearFome();
  const fv = Math.max(0, parseInt(document.getElementById("fv").value) || 0);
  const hum = Math.max(0, Math.min(10, parseInt(document.getElementById("hum").value) || 7));
  let pool = f;
  if (document.getElementById("c_disc").checked) pool += 1;
  if (document.getElementById("c_agrav").checked) pool += 2;
  if (document.getElementById("c_fv").checked) pool -= 2;
  if (hum > 7) pool -= (hum - 7);
  pool = Math.max(0, Math.min(10, pool));
  document.getElementById("loucura").value = pool;

  const [estado, pen] = ESCALA[f];
  log("\n> DADOS DA LOUCURA [" + estado + "]\n  Pool: " + pool + "d10 | FV: " + fv + "\n  ", "bestial");
  if (pool === 0) {
    log("Plenitude — 0 dados de loucura.\n", "sucesso");
    enviarDiscord("Loucura: " + estado, "Plenitude — 0 dados.", "#00FF00");
    return;
  }
  let cl = 0, cb = 0, fb = 0, disp = [];
  for (let i=0; i<pool; i++) {
    const r = d(10);
    if (r === 10 && fv > 0 && hum > 0) { log("["+r+"★] ", "destaque"); disp.push("**["+r+"★]**"); cl++; }
    else if (r === 10) { log("["+r+"☠] ", "bestial"); disp.push("**["+r+"☠]**"); cb++; }
    else if (r === 1) { log("["+r+"⚠] ", "critico"); disp.push("**["+r+"⚠]**"); fb++; }
    else if (r >= 6) { log("["+r+"] ", "sucesso"); disp.push("["+r+"]"); }
    else { log("["+r+"] ", "falha"); disp.push(r); }
  }
  log("\n");
  let desc = "**Dados da Loucura:** " + disp.join(" ") + "\n", cor = "#888888";
  if (cb > 0) { log("  ☠ CRÍTICO DA BESTA!\n", "bestial"); desc += "\n☠ **CRÍTICO DA BESTA!**"; cor = "#FF00FF"; }
  if (cl > 0) { log("  ★ CRÍTICO LIMPO (FV conteve)!\n", "destaque"); desc += "\n★ **CRÍTICO LIMPO!**"; if(cor==="#888888") cor="#00FFFF"; }
  if (fb > 0) { log("  ⚠ FALHA BESTIAL: " + COMPULSOES[f] + "\n", "critico"); desc += "\n⚠ **FALHA BESTIAL:** " + COMPULSOES[f]; if(cor!=="#FF00FF") cor="#FFD700"; }
  enviarDiscord("DADOS DA LOUCURA [" + estado + "]", desc, cor);
}

function rolarCustom() {
  const qtd = Math.max(1, Math.min(50, parseInt(document.getElementById("qtd").value) || 1));
  const faces = parseInt(document.getElementById("faces").value) || 10;
  const diff = parseInt(document.getElementById("diff").value) || 6;
  const louc = faces === 10 ? Math.max(0, Math.min(qtd, parseInt(document.getElementById("loucura").value) || 0)) : 0;
  const fv = Math.max(0, parseInt(document.getElementById("fv").value) || 1);
  executarHibrido(qtd, faces, diff, louc, fv);
}

function executarHibrido(qtd, faces, diff, louc, fv) {
  const norm = qtd - louc;
  let rn = [], rl = [], sb = 0, fc = 0, dn = [], dl = [];
  log("\n> Rolagem " + qtd + "d" + faces + " (Dif " + diff + (louc>0 ? " | L:"+louc : "") + "):\n  ", "normal");
  for (let i=0; i<norm; i++) {
    const r = d(faces); rn.push(r);
    if (r >= diff) sb++; if (r === 1) fc++;
    if (r === 1) { log(r+" ", "critico"); dn.push("**"+r+"**"); }
    else if (r >= diff) { log(r+" ", "sucesso"); dn.push("**"+r+"**"); }
    else { log(r+" ", "falha"); dn.push(r); }
  }
  for (let i=0; i<louc; i++) {
    const r = d(faces); rl.push(r);
    if (r >= diff) sb++; if (r === 1) fc++;
    if (r === 10 && fv > 0) { log("["+r+"★] ", "destaque"); dl.push("**["+r+"★]**"); }
    else if (r === 10) { log("["+r+"☠] ", "bestial"); dl.push("**["+r+"☠]**"); }
    else if (r === 1) { log("["+r+"⚠] ", "critico"); dl.push("**["+r+"⚠]**"); }
    else if (r >= diff) { log("["+r+"] ", "sucesso"); dl.push("**["+r+"]**"); }
    else { log("["+r+"] ", "falha"); dl.push("["+r+"]"); }
  }
  const saldo = Math.max(0, sb - fc);
  log("\n  Sucessos: " + sb + " | Falhas(1): -" + fc + " | Saldo: " + saldo + "\n", "destaque");
  let desc = "**Dados Normais:** " + dn.join(" ") + "\n" + (louc>0 ? "**Dados da Loucura:** " + dl.join(" ") + "\n" : "") + "\n**Saldo de Sucessos:** " + saldo;
  let cor = saldo > 0 ? "#00FF00" : "#FF3333";
  if (louc > 0 && rl.includes(10) && saldo > 0) {
    if (fv > 0) { log("  ★ CRÍTICO LIMPO!\n", "destaque"); desc += "\n★ **CRÍTICO LIMPO!**"; cor = "#00FFFF"; }
    else { log("  ☠ CRÍTICO BESTIAL!\n", "bestial"); desc += "\n☠ **CRÍTICO BESTIAL!**"; cor = "#FF00FF"; }
  }
  if (louc > 0 && saldo <= 0 && rl.includes(1)) {
    log("  ⚠ FALHA BESTIAL!\n", "critico"); desc += "\n⚠ **FALHA BESTIAL!**"; cor = "#FFD700";
  }
  enviarDiscord("Rolagem: " + qtd + "d" + faces + " (Dif " + diff + ")", desc, cor);
}

function calcularDano() {
  const tipo = document.getElementById("tipo_dano").value;
  const bruto = parseInt(document.getElementById("dano_bruto").value) || 0;
  const fort = parseInt(document.getElementById("fort").value) || 0;
  const trauma = tipo === "Superficial" ? Math.ceil(bruto / 2) : bruto;
  const final = Math.max(0, trauma - fort);
  log("\n> Dano " + tipo + " [Bruto:" + bruto + " | Fort:" + fort + "]: ", "normal");
  log(final + " nível(is)\n", "falha");
  enviarDiscord("Mitigação de Dano (" + tipo + ")", "**Bruto:** " + bruto + " | **Fortitude:** " + fort + "\n🩸 **Dano Final: " + final + " nível(is)**", final > 0 ? "#FF3333" : "#888888");
}

function execCmd() {
  const el = document.getElementById("cmd");
  const cmd = el.value.trim().toLowerCase(); el.value = "";
  if (!cmd) return;
  if (cmd === "!limpar" || cmd === "!clear") { document.getElementById("console").innerHTML = ""; return; }
  if (cmd === "!moeda") { caraCoroa(); return; }
  if (cmd === "!despertar" || cmd === "!rouse") { rouseCheck(); return; }
  const m = cmd.match(/^!roll\s+(\d+)d(\d+)(?:\s+(\d+))?(?:\s+(\d+))?(?:\s+(\d+))?$/);
  if (m) {
    const q = parseInt(m[1]), f = parseInt(m[2]);
    if (!m[3]) {
      let res = []; for(let i=0;i<q;i++) res.push(d(f));
      log("\n> " + cmd + "\n  { " + res.join(", ") + " }\n", "destaque");
      enviarDiscord("Rolagem: " + q + "d" + f, "Resultado: **[" + res.join(", ") + "]**", "#888888");
    } else {
      executarHibrido(q, f, parseInt(m[3]), parseInt(m[4]||0), m[5]!==undefined ? parseInt(m[5]) : (parseInt(document.getElementById("fv").value)||1));
    }
  }
}
